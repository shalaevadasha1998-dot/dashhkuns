name: narrow type and italic specimens only
on:
  push:
    branches: [design/mtv-type-specimens]
    paths: [.github/workflows/mtv-type-specimens.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: prepare isolated rendering environment
        run: |
          python3 -m venv /tmp/font-preview-env
          /tmp/font-preview-env/bin/pip -q install playwright fonttools requests
          /tmp/font-preview-env/bin/playwright install --with-deps chromium
      - name: render narrow lettering and real italic glyphs without site changes
        run: |
          /tmp/font-preview-env/bin/python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import quote
          from io import BytesIO
          import requests, json, zipfile
          from fontTools.ttLib import TTFont
          from playwright.sync_api import sync_playwright
          root=Path('/tmp/narrow-italic-specimens'); (root/'fonts').mkdir(parents=True,exist_ok=True)
          output=Path('narrow-italic-output');output.mkdir(exist_ok=True)
          fonts={
            'oswald':('oswald','Oswald[wght].ttf'),
            'oldstandard':('oldstandardtt','OldStandard-Italic.ttf'),
            'playfair':('playfairdisplay','PlayfairDisplay-Italic[wght].ttf'),
            'bona':('bonanova','BonaNova-Italic.ttf')
          }
          letters='абвгдеёжзийклмнопрстуфхцчшщъыьэюя'
          def inspect_font(key,path,source,license_name):
            f=TTFont(path);cmap=f.getBestCmap()
            missing=[c for c in letters+letters.upper() if ord(c) not in cmap]
            assert not missing,(key,missing)
            assert any(cmap[ord(c)]!=cmap[ord(c.upper())] for c in 'абвгде'),key
            return {'russianAlphabetComplete':True,'separateLowercaseGlyphs':True,'source':source,'license':license_name,'names':[n.toUnicode() for n in f['name'].names if n.nameID in [1,2] and n.platformID==3][:4]}
          def fetch(item):
            key,(folder,name)=item;base='https://raw.githubusercontent.com/google/fonts/main/ofl/'+folder+'/'
            for remote,local in [(name,key+'.ttf'),('OFL.txt',key+'-OFL.txt')]:
              r=requests.get(base+quote(remote),timeout=45);r.raise_for_status();(root/'fonts'/local).write_bytes(r.content)
            return key,inspect_font(key,root/'fonts'/(key+'.ttf'),base+quote(name),'SIL OFL 1.1')
          with ThreadPoolExecutor(max_workers=4) as pool:validation=dict(pool.map(fetch,fonts.items()))
          akrobat_url='https://media.uprock.school/fonts/Akrobat/Akrobat.zip'
          r=requests.get(akrobat_url,timeout=45);r.raise_for_status()
          with zipfile.ZipFile(BytesIO(r.content)) as z:
            candidates=[n for n in z.namelist() if 'extrabold' in n.lower().replace('-','').replace('_','') and n.lower().endswith(('.otf','.ttf')) and '__MACOSX' not in n]
            assert candidates,z.namelist()
            path=root/'fonts'/'akrobat.otf';path.write_bytes(z.read(candidates[0]))
          validation['akrobat']=inspect_font('akrobat',path,akrobat_url,'Fontfabric free-font EULA; publisher confirms free commercial use')
          css='''
          @font-face{font-family:oswald;src:url(fonts/oswald.ttf);font-weight:200 700}
          @font-face{font-family:oldstandard;src:url(fonts/oldstandard.ttf);font-weight:400;font-style:italic}
          @font-face{font-family:playfair;src:url(fonts/playfair.ttf);font-weight:400 900;font-style:italic}
          @font-face{font-family:bona;src:url(fonts/bona.ttf);font-weight:400;font-style:italic}
          @font-face{font-family:akrobat;src:url(fonts/akrobat.otf);font-weight:800}
          *{box-sizing:border-box}body{margin:0;background:#fbfaf7;color:#151414;font-family:Arial,sans-serif;font-synthesis:none}
          .board{width:1280px;padding:42px 64px 24px}
          header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid #ccc7c4;font-size:18px;color:#65605b}
          .brand{font-weight:700;letter-spacing:-.03em;color:#151414;font-size:24px}
          article{padding:34px 0 36px;border-bottom:1px solid #ccc7c4}
          .label{display:flex;align-items:baseline;gap:24px;margin-bottom:34px;font-size:22px}
          .num{font-size:20px;color:#77716a}.names{font-weight:400;letter-spacing:-.03em}
          .lead{font-size:99px;line-height:1.08;letter-spacing:-.018em;white-space:nowrap;width:max-content}
          .line{display:flex;align-items:baseline;gap:26px;margin-top:5px;white-space:nowrap;width:max-content}
          .launch{font-size:128px;line-height:1.3;letter-spacing:-.03em;color:#d80a68;font-style:italic;font-weight:400}
          .projects{font-size:117px;line-height:1.05;letter-spacing:-.018em}
          .details{display:grid;grid-template-columns:340px 1fr;align-items:baseline;margin-top:24px;padding-top:18px;border-top:1px solid #e2ded9}
          .sample-main{font-size:58px;letter-spacing:-.01em;line-height:1.15}
          .sample-italic{font-style:italic;font-size:46px;font-weight:400;letter-spacing:-.025em;line-height:1.35}
          .a .lead,.a .projects,.a .sample-main{font-family:oswald;font-weight:600}
          .a .launch,.a .sample-italic{font-family:oldstandard}
          .b .lead,.b .projects,.b .sample-main{font-family:akrobat;font-weight:800}
          .b .launch,.b .sample-italic{font-family:playfair;font-weight:500}
          .c .lead,.c .projects,.c .sample-main{font-family:oswald;font-weight:500}
          .c .launch,.c .sample-italic{font-family:bona}
          footer{display:flex;justify-content:space-between;padding-top:22px;font-size:16px;color:#706a65}
          '''
          cards=[('a','01','oswald semibold + old standard tt italic'),('b','02','akrobat extrabold + playfair display italic'),('c','03','oswald medium + bona nova italic')]
          parts=[]
          for cls,n,name in cards:
            parts.append(f'<article class="{cls}" id="v{n}"><div class="label"><span class="num">{n}</span><span class="names">{name}</span></div><div class="hero"><div class="lead fit">придумываю, собираю и</div><div class="line fit"><span class="launch">запускаю</span><span class="projects">проекты</span></div></div><div class="details"><span class="sample-main">дашкунс</span><span class="sample-italic">идея становится реальностью</span></div></article>')
          html='<!doctype html><html lang="ru"><meta charset="utf-8"><style>'+css+'</style><main class="board"><header><span class="brand">dashhkuns</span><span>узкий прямой + выразительный курсив</span></header>'+''.join(parts)+'<footer><span>настоящие начертания · кириллица · строчные буквы</span><span>тест, не обновление сайта</span></footer></main></html>'
          (root/'index.html').write_text(html,encoding='utf-8')
          with sync_playwright() as p:
            browser=p.chromium.launch();page=browser.new_page(viewport={'width':1280,'height':900},device_scale_factor=1.5)
            errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
            page.goto((root/'index.html').as_uri(),wait_until='load')
            page.evaluate('''async()=>{await Promise.all([document.fonts.load('600 90px oswald','придумываю'),document.fonts.load('800 90px akrobat','придумываю'),document.fonts.load('italic 400 90px oldstandard','запускаю'),document.fonts.load('italic 500 90px playfair','запускаю'),document.fonts.load('italic 400 90px bona','запускаю')]);await document.fonts.ready;for(const el of document.querySelectorAll('.lead')){let n=parseFloat(getComputedStyle(el).fontSize);while(el.getBoundingClientRect().width>el.parentElement.clientWidth-4){n-=1;el.style.fontSize=n+'px';}}for(const el of document.querySelectorAll('.line')){while(el.getBoundingClientRect().width>el.parentElement.clientWidth-4){for(const child of el.children){child.style.fontSize=(parseFloat(getComputedStyle(child).fontSize)-1)+'px';}}}}''')
            faces=page.evaluate('()=>Array.from(document.fonts).map(f=>({family:f.family,status:f.status}))')
            assert all(f['status']=='loaded' for f in faces),faces
            assert not errors,errors
            page.screenshot(path=str(output/'dashhkuns-narrow-italic-options.png'),full_page=True)
            for cls,n,name in cards:page.locator('#v'+n).screenshot(path=str(output/('dashhkuns-pair-'+n+'.png')))
            browser.close()
          (output/'validation.json').write_text(json.dumps({'fonts':validation,'faces':faces,'websiteChanged':False,'errors':errors},ensure_ascii=False,indent=2))
          print('Rendered three pairs with real lowercase Cyrillic outlines. Only PNG images and validation are exported; no font files.')
          PY
      - name: return only raster previews and validation
        uses: actions/upload-artifact@v4
        with:
          name: dashhkuns-narrow-italic-review
          path: narrow-italic-output/
          retention-days: 7
