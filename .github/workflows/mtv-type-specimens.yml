name: thin black ornate type preview only
on:
  push:
    branches: [design/mtv-type-specimens]
    paths: [.github/workflows/mtv-type-specimens.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: prepare isolated rendering environment
        run: |
          python3 -m venv /tmp/font-preview-env
          /tmp/font-preview-env/bin/pip -q install playwright fonttools requests
          /tmp/font-preview-env/bin/playwright install --with-deps chromium
      - name: render thin black lettering and ornate calligraphy without site changes
        run: |
          /tmp/font-preview-env/bin/python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import quote
          import requests, json
          from fontTools.ttLib import TTFont
          from playwright.sync_api import sync_playwright
          root=Path('/tmp/thin-ornate-type'); (root/'fonts').mkdir(parents=True,exist_ok=True)
          output=Path('thin-ornate-output'); output.mkdir(exist_ok=True)
          fonts={
            'thin':('firasansextracondensed','FiraSansExtraCondensed-ExtraLight.ttf'),
            'light':('firasansextracondensed','FiraSansExtraCondensed-Light.ttf'),
            'regular':('firasansextracondensed','FiraSansExtraCondensed-Regular.ttf'),
            'bold':('firasansextracondensed','FiraSansExtraCondensed-Bold.ttf'),
            'ornate':('greatvibes','GreatVibes-Regular.ttf')
          }
          letters='абвгдеёжзийклмнопрстуфхцчшщъыьэюя'
          def fetch(item):
            key,(folder,name)=item
            base='https://raw.githubusercontent.com/google/fonts/main/ofl/'+folder+'/'
            for remote,local in [(name,key+'.ttf'),('OFL.txt',key+'-OFL.txt')]:
              r=requests.get(base+quote(remote),timeout=45); r.raise_for_status()
              (root/'fonts'/local).write_bytes(r.content)
            font=TTFont(root/'fonts'/(key+'.ttf')); cmap=font.getBestCmap()
            missing=[c for c in letters+letters.upper() if ord(c) not in cmap]
            assert not missing,(key,missing)
            tags=sorted(set(r.FeatureTag for r in font['GSUB'].table.FeatureList.FeatureRecord)) if 'GSUB' in font else []
            return key,{'russianAlphabetComplete':True,'source':base+quote(name),'license':'SIL OFL 1.1','features':tags}
          with ThreadPoolExecutor(max_workers=5) as pool:
            validation=dict(pool.map(fetch,fonts.items()))
          css='''
          @font-face{font-family:base;src:url(fonts/thin.ttf);font-weight:200;font-style:normal}
          @font-face{font-family:base;src:url(fonts/light.ttf);font-weight:300;font-style:normal}
          @font-face{font-family:base;src:url(fonts/regular.ttf);font-weight:400;font-style:normal}
          @font-face{font-family:base;src:url(fonts/bold.ttf);font-weight:700;font-style:normal}
          @font-face{font-family:ornate;src:url(fonts/ornate.ttf);font-weight:400;font-style:normal}
          *{box-sizing:border-box}html,body{margin:0;background:#fff;color:#0a0a0a;font-family:base,sans-serif;font-weight:300;font-synthesis:none}
          body{font-size:24px}a{color:inherit;text-decoration:none}p,h1,h2{margin:0}strong{font-weight:700}
          .sheet{max-width:1280px;margin:auto;padding:34px 64px 24px}
          header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid #171717;gap:20px}
          .brand{font-size:36px;font-weight:300;letter-spacing:.01em}
          nav{display:flex;gap:32px;align-items:center;font-size:21px;font-weight:300}
          .stamp{font-size:18px;letter-spacing:.07em;font-weight:300}
          .hero{position:relative;padding:46px 8px 26px}
          .eyebrow{font-size:18px;font-weight:300;letter-spacing:.13em;margin-bottom:30px}
          h1{font-weight:200;letter-spacing:-.01em}
          .first{display:block;font-size:90px;line-height:1.12;white-space:nowrap}
          .second{display:flex;align-items:baseline;gap:40px;white-space:nowrap;margin-top:2px;padding-right:14px}
          .ornate{font-family:ornate;font-style:normal;font-weight:400;letter-spacing:0;line-height:1.25;font-kerning:normal;font-feature-settings:'liga' 1,'calt' 1}
          .launch{font-size:218px}
          .projects{font-size:144px;line-height:1.1;font-weight:200;letter-spacing:-.025em}
          .description{max-width:675px;margin-top:10px;font-size:28px;line-height:1.48;font-weight:300}
          .hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:36px;margin-top:32px}
          .cta{display:inline-flex;border-bottom:1px solid #0a0a0a;padding:0 0 6px;font-size:25px;font-weight:700;white-space:nowrap}
          .note{font-size:20px;font-weight:300;max-width:350px;line-height:1.45;text-align:right}
          .detail{display:grid;grid-template-columns:1fr 1fr;column-gap:46px;row-gap:28px;border-top:1px solid #171717;margin-top:25px;padding-top:30px}
          .detail-title{font-size:17px;letter-spacing:.10em;font-weight:300;margin-bottom:17px}
          .base-example{font-size:61px;line-height:1.18;font-weight:200;letter-spacing:-.015em}
          .base-example strong{font-weight:700}
          .body-example{font-size:23px;line-height:1.5;font-weight:300;max-width:510px;margin-top:17px}
          .flourish{font-size:104px;white-space:nowrap;padding:0 12px 0 6px}
          .flourish-sub{font-size:25px;line-height:1.45;font-weight:300;margin-top:2px}
          footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #171717;margin-top:35px;padding-top:19px;font-size:18px;line-height:1.4;font-weight:300}
          @media(max-width:600px){
            .sheet{padding:23px 24px 20px}.brand{font-size:30px}nav{display:none}header{padding-bottom:17px}.stamp{font-size:15px;letter-spacing:.01em}
            .hero{padding:33px 0 18px}.eyebrow{font-size:16px;letter-spacing:.08em;margin-bottom:22px}
            .first{font-size:43px;white-space:normal;max-width:300px;line-height:1.17}
            .second{display:block;margin-top:14px;padding:0;white-space:normal}.launch{display:block;font-size:123px;line-height:1.06}.projects{display:block;font-size:91px;margin-top:6px;line-height:1.1}
            .description{font-size:23px;line-height:1.45;margin-top:22px}.hero-bottom{align-items:start;flex-direction:column;gap:25px;margin-top:27px}.cta{font-size:24px}.note{font-size:18px;text-align:left}
            .detail{grid-template-columns:1fr;margin-top:22px;padding-top:25px;gap:28px}.detail-title{font-size:16px;margin-bottom:12px}.base-example{font-size:43px}.body-example{font-size:21px;margin-top:15px}.flourish{font-size:81px}.flourish-sub{font-size:21px}
            footer{flex-direction:column;gap:7px;font-size:16px;margin-top:29px;padding-top:17px}
          }
          '''
          html='''<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'''+css+'''</style></head><body><main class="sheet"><header><span class="brand">dashhkuns</span><nav><span>что делаю</span><span>проекты</span><span>обо мне</span><span>контакт</span></nav><span class="stamp">тест типографики</span></header><section class="hero"><p class="eyebrow">креативный продюсер · идея / команда / запуск</p><h1><span class="first">придумываю, собираю и</span><span class="second"><span class="ornate launch">запускаю</span><span class="projects">проекты</span></span></h1><p class="description">связываю концепцию, людей и производство<br>и довожу проект <strong>до запуска</strong></p><div class="hero-bottom"><span class="cta">обсудить проект ↗</span><p class="note">тонкая основа · чёрный текст<br>жирное — только смысловой акцент</p></div></section><section class="detail"><div><h2 class="detail-title">01 / основа и смысловой акцент</h2><p class="base-example">много идей<br><strong>один результат</strong></p><p class="body-example">обычный текст остаётся лёгким и спокойным<br>жирным выделяем <strong>только важное</strong></p></div><div><h2 class="detail-title">02 / вычурный каллиграфический акцент</h2><p class="ornate flourish">дерзко</p><p class="flourish-sub">не наклон обычных букв,<br>а отдельный рисунок с росчерками</p></div></section><footer><span>fira sans extra condensed · great vibes</span><span>настоящие шрифты / кириллица / чёрный на белом</span></footer></main></body></html>'''
          (root/'index.html').write_text(html,encoding='utf-8')
          reports=[]
          with sync_playwright() as p:
            browser=p.chromium.launch()
            for width,label in [(1280,'desktop'),(390,'mobile')]:
              page=browser.new_page(viewport={'width':width,'height':1000},device_scale_factor=1.5)
              errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto((root/'index.html').as_uri(),wait_until='load')
              page.evaluate('''async()=>{await Promise.all([document.fonts.load('200 90px base','придумываю'),document.fonts.load('300 24px base','обычный текст'),document.fonts.load('400 24px base','буквы'),document.fonts.load('700 24px base','до запуска'),document.fonts.load('400 180px ornate','запускаю')]);await document.fonts.ready;const fit=(el,parent)=>{let i=0;while(el.getBoundingClientRect().width>parent.clientWidth-8&&i++<80){el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)-1)+'px'}};if(innerWidth>600){const first=document.querySelector('.first');first.style.width='max-content';fit(first,first.parentElement);const second=document.querySelector('.second');second.style.width='max-content';let i=0;while(second.getBoundingClientRect().width>second.parentElement.clientWidth-8&&i++<80){for(const c of second.children)c.style.fontSize=(parseFloat(getComputedStyle(c).fontSize)-1)+'px'}}else{for(const el of document.querySelectorAll('.launch,.flourish')){el.style.width='max-content';fit(el,el.parentElement)}}}''')
              faces=page.evaluate('()=>Array.from(document.fonts).map(f=>({family:f.family,weight:f.weight,status:f.status}))')
              assert all(f['status']=='loaded' for f in faces),faces
              assert not errors,errors
              overflow=page.evaluate('()=>document.documentElement.scrollWidth>innerWidth')
              assert not overflow, width
              page.screenshot(path=str(output/('dashhkuns-thin-ornate-'+label+'.png')),full_page=True)
              reports.append({'width':width,'faces':faces,'overflow':overflow,'jsErrors':errors})
              page.close()
            browser.close()
          (output/'validation.json').write_text(json.dumps({'fonts':validation,'browser':reports,'websiteChanged':False,'fontFilesExported':False},ensure_ascii=False,indent=2),encoding='utf-8')
          print('Black on white: thin base, ornate real Cyrillic script, bold only at semantic accents. Preview only.')
          PY
      - name: return only raster previews and validation
        uses: actions/upload-artifact@v4
        with:
          name: dashhkuns-thin-ornate-review
          path: thin-ornate-output/
          retention-days: 7
