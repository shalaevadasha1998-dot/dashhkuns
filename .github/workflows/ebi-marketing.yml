name: EBI Marketing static QA
on:
  push:
    branches: [ebi-production]
    paths: ['ebi-marketing/**', '.github/workflows/ebi-marketing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify static build and SEO routes
        run: python3 ebi-marketing/scripts/check_site.py
