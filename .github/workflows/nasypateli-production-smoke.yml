name: nasypateli protected production route
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nasypateli-production-smoke.yml'
      - 'api/nasypateli-live.js'
      - 'api/package.json'
      - 'nasypateli-login.html'
      - 'vercel.json'
      - 'assets/nasypateli-entry.css'
  push:
    branches: [main]
    paths:
      - 'api/nasypateli-live.js'
      - 'api/package.json'
      - 'nasypateli-login.html'
      - 'vercel.json'
      - 'assets/nasypateli-entry.css'
      - '.github/workflows/nasypateli-production-smoke.yml'
permissions:
  contents: read
jobs:
  live-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: require working login and password rejection together after deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            entry="$(curl --silent --show-error --location --max-time 8 --dump-header /tmp/entry-headers --output /tmp/entry-body --write-out '%{http_code}' 'https://dashhkuns.com/nasypateli-live' || true)"
            post="$(curl --silent --show-error --max-time 8 --header 'Origin: https://dashhkuns.com' --header 'Content-Type: application/x-www-form-urlencoded' --data 'action=login&password=invalid-ci-password' --dump-header /tmp/post-headers --output /tmp/post-body --write-out '%{http_code}' 'https://dashhkuns.com/nasypateli-live/app' || true)"
            if grep -q 'id="console"\|id="character"' /tmp/entry-body /tmp/post-body; then
              echo 'private content was returned without authentication' >&2
              exit 1
            fi
            if grep -qi '^set-cookie:.*nasypateli_live_session=[^;]' /tmp/post-headers; then
              echo 'invalid credentials received an authenticated session' >&2
              exit 1
            fi
            echo "attempt=$attempt entry=$entry invalid_password=$post"
            if [ "$entry" = 200 ] && [ "$post" = 200 ] &&
               grep -q 'войди по паролю' /tmp/entry-body &&
               grep -q 'неверный пароль' /tmp/post-body &&
               grep -qi 'x-robots-tag:.*noindex' /tmp/entry-headers &&
               grep -qi 'cache-control:.*no-store' /tmp/post-headers; then
              ok=1
              echo 'production entry and protected handler verified; anonymous content and invalid credentials remain rejected'
              break
            fi
            sleep 7
          done
          if [ "$ok" -ne 1 ]; then
            echo 'production did not become healthy within the deployment window' >&2
            exit 1
          fi
