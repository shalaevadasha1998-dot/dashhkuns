name: wishlist public smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wishlist/**','scripts/wishlist*','.github/workflows/wishlist-smoke.yml']
permissions:
  contents: read
concurrency:
  group: wishlist-public-smoke
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: javascript syntax
        run: node --check wishlist/app.js && node --check wishlist/reservations.js
      - name: isolated browser tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - name: verify deployed release, transparent png and booking form
        run: python scripts/wishlist-live-release.py
      - name: existing search and shortlist regressions
        run: python scripts/wishlist-browser-smoke.py
      - name: actual reservation race, private capability and cancellation
        run: python scripts/wishlist-reservation-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-evidence
          path: |
            ${{ runner.temp }}/wishlist-live
            ${{ runner.temp }}/wishlist-evidence
            ${{ runner.temp }}/wishlist-refresh
          retention-days: 5
