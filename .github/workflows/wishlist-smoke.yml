name: wishlist public smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wishlist/**', 'scripts/wishlist-browser-smoke.py', '.github/workflows/wishlist-smoke.yml']
permissions:
  contents: read
concurrency:
  group: wishlist-public-smoke
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: javascript syntax
        run: node --check wishlist/app.js
      - name: isolated browser tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: public page and regressions
        run: python scripts/wishlist-browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-evidence
          path: ${{ runner.temp }}/wishlist-evidence
          retention-days: 3
