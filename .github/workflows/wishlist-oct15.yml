name: wishlist october additions
on:
  push:
    branches: [feat/wishlist-oct15-additions]
    paths: ['scripts/wishlist-oct15-sources.py','.github/workflows/wishlist-oct15.yml']
permissions:
  contents: read
concurrency:
  group: wishlist-oct15
  cancel-in-progress: true
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy requests beautifulsoup4
      - run: python scripts/wishlist-oct15-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-oct15-sources
          path: ${{ runner.temp }}/wishlist-oct15-sources
          retention-days: 4
