name: wishlist private reservations and cutout preparation
on:
  push:
    branches: [feat/wishlist-reservations-cutouts-20261014]
    paths: ['scripts/wishlist-copy-refresh.py','scripts/wishlist-build-cutouts.py','scripts/wishlist-reservation-smoke.py','wishlist/reservations.js','wishlist/reservations.css','.github/workflows/wishlist-refresh.yml']
permissions:
  contents: write
concurrency:
  group: wishlist-cutout-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wishlist-reservations-cutouts-20261014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: independent local asset tooling
        run: python -m pip install --disable-pip-version-check 'rembg[cpu]==2.0.62' 'playwright==1.57.0'
      - name: copy changes
        run: python scripts/wishlist-copy-refresh.py
      - name: transparent product assets
        run: python scripts/wishlist-build-cutouts.py
      - name: validate javascript
        run: node --check wishlist/app.js && node --check wishlist/reservations.js
      - name: install browser
        run: python -m playwright install --with-deps chromium
      - name: test private reservations and local page
        run: python scripts/wishlist-reservation-smoke.py
      - name: persist prepared files only on feature branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wishlist/index.html wishlist/app.js wishlist/data.json wishlist/items
          if ! git diff --cached --quiet; then
            git commit -m 'build(wishlist): verified transparent items and copy without dots'
            git push origin HEAD:feat/wishlist-reservations-cutouts-20261014
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-refresh-evidence
          path: ${{ runner.temp }}/wishlist-refresh
          retention-days: 5
