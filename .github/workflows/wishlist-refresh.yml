name: wishlist private reservations and cutout preparation
on:
  push:
    branches: [feat/wishlist-reservations-cutouts-20261014]
    paths: ['scripts/wishlist-finish-assets.py','scripts/wishlist-reservation-smoke.py','wishlist/reservations.js','wishlist/reservations.css','.github/workflows/wishlist-refresh.yml']
permissions:
  contents: write
concurrency:
  group: wishlist-cutout-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wishlist-reservations-cutouts-20261014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: isolated tools
        run: python -m pip install --disable-pip-version-check pillow numpy playwright==1.57.0
      - name: finalize existing reviewed cutouts
        run: python scripts/wishlist-finish-assets.py
      - name: validate javascript
        run: node --check wishlist/app.js && node --check wishlist/reservations.js
      - name: browser
        run: python -m playwright install --with-deps chromium
      - name: actual private reservations and staged browser checks
        run: python scripts/wishlist-reservation-smoke.py
      - name: persist verified assets on feature branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wishlist/items
          if ! git diff --cached --quiet; then
            git commit -m 'fix(wishlist): remove final studio backgrounds from dyson cutouts'
            git push origin HEAD:feat/wishlist-reservations-cutouts-20261014
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-refresh-evidence
          path: ${{ runner.temp }}/wishlist-refresh
          retention-days: 5
